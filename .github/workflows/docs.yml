name: docs

on:
  # 每当 push 到 main 分支时触发部署
  push:
    branches: [main]
  # 手动触发部署
  workflow_dispatch:
    inputs:
      article_paths:
        description: 需要补发到微信公众号的文章路径，多个路径用空格分隔
        required: false
        type: string

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # "最近更新时间" 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 选择要使用的 pnpm 版本
          version: 9
          # 使用 pnpm 安装依赖 (v4: run_install 是 boolean, args 单独传入)
          run_install: true
          args: --frozen-lockfile --strict-peer-dependencies

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 选择要使用的 node 版本
          node-version: 20
          # 缓存 pnpm 依赖
          cache: pnpm

      - name: Test article syndication
        run: pnpm run test:syndicate

      # 运行构建脚本
      - name: Build VuePress site
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |-
          pnpm run docs:build
          > docs/.vuepress/dist/.nojekyll

      - name: Publish new articles to WeChat and CSDN
        if: (github.event_name == 'push' && github.run_attempt == 1) || (github.event_name == 'workflow_dispatch' && inputs.article_paths != '')
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          ARTICLE_PATHS: ${{ inputs.article_paths }}
          BLOG_SITE_URL: https://blog.chcbz.net
          BLOG_AUTHOR: 布衣云水客
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_THUMB_MEDIA_ID: ${{ secrets.WECHAT_THUMB_MEDIA_ID }}
          WECHAT_PUBLISH_MODE: ${{ github.event_name == 'workflow_dispatch' && 'draft' || vars.WECHAT_PUBLISH_MODE }}
          CSDN_COOKIE: ${{ github.event_name == 'push' && secrets.CSDN_COOKIE || '' }}
          CSDN_USERNAME: ${{ github.event_name == 'push' && vars.CSDN_USERNAME || '' }}
          CSDN_PUBLISH_MODE: ${{ github.event_name == 'push' && vars.CSDN_PUBLISH_MODE || '' }}
          SYNDICATE_STRICT: "true"
        run: |-
          if [ -n "$ARTICLE_PATHS" ]; then
            pnpm run publish:syndicate -- $ARTICLE_PATHS
          else
            pnpm run publish:syndicate
          fi

      # 查看 workflow 的文档来获取更多信息
      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # 部署到 gh-pages 分支
          target_branch: gh-pages
          # 部署目录为 VuePress 的默认输出目录
          build_dir: docs/.vuepress/dist
          fqdn: blog.chcbz.net
        env:
          # @see https://docs.github.com/cn/actions/reference/authentication-in-a-workflow#about-the-github_token-secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
